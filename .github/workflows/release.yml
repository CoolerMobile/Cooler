name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: false
        type: string
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: cooler-${{ github.event_name == 'schedule' && 'nightly' || 'release' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      tag: ${{ steps.metadata.outputs.tag }}
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: metadata
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          package_version="$(jq -r '.version' package.json)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package.json version: $package_version" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            channel="nightly"
            version="$package_version"
            tag="nightly-$(date -u +%Y%m%d)-$RUN_NUMBER"
            name="Cooler nightly $(date -u +%Y-%m-%d)"
            prerelease="true"
          else
            channel="release"
            version="$DISPATCH_VERSION"

            if [[ -z "$version" ]]; then
              echo "A release version is required for manual dispatches." >&2
              exit 1
            fi

            if [[ "$version" != "$package_version" ]]; then
              echo "Workflow version $version does not match package.json version $package_version" >&2
              exit 1
            fi

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $version" >&2
              exit 1
            fi

            tag="v$version"
            name="Cooler v$version"
            prerelease="false"
          fi

          {
            echo "channel=$channel"
            echo "tag=$tag"
            echo "name=$name"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} (${{ needs.prepare.outputs.channel }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-14
            extension: ipa
          - platform: android
            runner: ubuntu-latest
            extension: apk
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build locally with EAS (one retry maximum)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -uo pipefail
          mkdir -p artifacts
          output="artifacts/Cooler-${PROFILE}-${VERSION}-${PLATFORM}.${EXTENSION}"

          for attempt in 1 2; do
            echo "Starting local ${PLATFORM} build (attempt ${attempt}/2)."
            rm -f "$output"

            if bunx eas-cli@latest build \
              --local \
              --platform "$PLATFORM" \
              --profile "$PROFILE" \
              --non-interactive \
              --output "$output"; then
              echo "Local ${PLATFORM} build succeeded on attempt ${attempt}."
              exit 0
            fi

            if [[ "$attempt" == 2 ]]; then
              echo "Local ${PLATFORM} build failed twice; stopping without further retries." >&2
              exit 1
            fi

            echo "Local ${PLATFORM} build failed; retrying once." >&2
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cooler-${{ needs.prepare.outputs.channel }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS and Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cooler-${{ needs.prepare.outputs.channel }}-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.channel == 'release' }}
          generate_release_notes: true
          body: |
            Built from commit ${{ github.sha }}.

            This ${{ needs.prepare.outputs.channel }} release includes iOS and Android artifacts. GitHub generated the changelog below from the commits since the previous release, including commit authors and new contributors.
          files: artifacts/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
