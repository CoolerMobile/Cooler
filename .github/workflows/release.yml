name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - nightly

      platform:
        description: Platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios

      submit:
        description: Submit iOS to TestFlight (Google Play submission is not configured)
        required: true
        default: false
        type: boolean

      bump:
        description: Version bump (auto, patch, minor, major, or x.y.z)
        required: true
        default: auto
        type: string

concurrency:
  group: cooler-${{ inputs.channel }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    if: github.actor == 'danfq' && github.triggering_actor == 'danfq'
    runs-on: ubuntu-latest

    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      platforms: ${{ steps.metadata.outputs.platforms }}
      tag: ${{ steps.metadata.outputs.tag }}
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      sha: ${{ steps.metadata.outputs.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate release options
        env:
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail

          if [[ "$SUBMIT" == "true" && "$CHANNEL" != "release" ]]; then
            echo "Nightly builds are not submitted to app stores." >&2
            exit 1
          fi

      - name: Resolve release metadata and bump version
        id: metadata
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_PLATFORM: ${{ inputs.platform }}
          DISPATCH_SUBMIT: ${{ inputs.submit }}
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          channel="$DISPATCH_CHANNEL"
          platform="$DISPATCH_PLATFORM"

          version="$(bun scripts/release.ts --bump-only "${REQUESTED_BUMP:-auto}")"

          if [[ "$platform" == "android" && "$DISPATCH_SUBMIT" == "true" ]]; then
            platforms='["android","ios"]'
          else
            platforms="[\"$platform\"]"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            app.json \
            android/app/build.gradle \
            ios/Cooler/Info.plist \
            ios/Cooler.xcodeproj/project.pbxproj

          if [[ "$channel" == "nightly" ]]; then
            git commit -m "chore: release nightly v${version}"
            tag="nightly-v${version}"
            name="Cooler nightly v${version}"
            prerelease="true"
          else
            git commit -m "chore: release v${version}"
            tag="v${version}"
            name="Cooler v${version}"
            prerelease="false"
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "channel=$channel"
            echo "platforms=$platforms"
            echo "tag=$tag"
            echo "name=$name"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: EAS ${{ matrix.platform }} build (${{ needs.prepare.outputs.channel }})
    if: github.actor == 'danfq' && github.triggering_actor == 'danfq'
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}

    steps:
      - name: Check out prepared source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fix generated license metadata
        run: bun run fix:licenses

      - name: Queue EAS cloud build and download artifact
        env:
          PLATFORM: ${{ matrix.platform }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          if [[ "$PLATFORM" == "ios" ]]; then
            extension="ipa"

            if [[ "$CHANNEL" == "nightly" ]]; then
              profile="nightly"
            else
              profile="production"
            fi
          else
            extension="apk"
            profile="$CHANNEL"
          fi

          for attempt in 1 2; do
            echo "Queueing EAS ${PLATFORM} build using profile \"${profile}\" (attempt ${attempt}/2)."

            if eas build \
              --platform "$PLATFORM" \
              --profile "$profile" \
              --non-interactive \
              --wait \
              --json > build.json; then
              break
            fi

            if [[ "$attempt" == "2" ]]; then
              echo "EAS ${PLATFORM} build failed twice; stopping without further retries." >&2
              exit 1
            fi

            echo "EAS ${PLATFORM} build failed; retrying once." >&2
          done

          build_id="$(
            jq -er '
              if type == "array" then .[0] else . end
              | .id
            ' build.json
          )"

          artifact_url="$(
            jq -er '
              if type == "array" then .[0] else . end
              | .artifacts.applicationArchiveUrl
            ' build.json
          )"

          output="artifacts/Cooler-${CHANNEL}-${VERSION}-${PLATFORM}.${extension}"

          echo "EAS build ID: ${build_id}"
          echo "Downloading build artifact to ${output}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$output" \
            "$artifact_url"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cooler-${{ needs.prepare.outputs.channel }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  submit:
    name: Submit iOS build to TestFlight
    if: >-
      github.actor == 'danfq' &&
      github.triggering_actor == 'danfq' &&
      inputs.submit &&
      inputs.channel == 'release'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download iOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: cooler-${{ needs.prepare.outputs.channel }}-ios
          path: artifacts

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit build
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          artifact="$(find artifacts -type f -name '*.ipa' -print -quit)"

          if [[ -z "$artifact" ]]; then
            echo "No iOS IPA was downloaded." >&2
            exit 1
          fi

          echo "Submitting ${artifact} to TestFlight."

          eas submit \
            --platform ios \
            --path "$artifact" \
            --profile production \
            --non-interactive \
            --wait

          if [[ "$PLATFORM" == "android" ]]; then
            message="The iOS app was submitted to TestFlight. The Android app was not submitted to Google Play because a Google Play Developer account is not configured."
          else
            message="The iOS app was submitted to TestFlight."
          fi

          echo "$message"
          echo "### App store submission" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: github.actor == 'danfq' && github.triggering_actor == 'danfq'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out prepared source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: cooler-${{ needs.prepare.outputs.channel }}-*
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          release_parent="${RELEASE_SHA}^"

          mapfile -t release_tags < <(
            git tag \
              --merged "$release_parent" \
              --list 'v[0-9]*' 'nightly-v[0-9]*' \
              --sort=-creatordate
          )

          previous_tag="${release_tags[0]:-}"

          if [[ -n "$previous_tag" ]]; then
            revision_range="${previous_tag}..${release_parent}"
          else
            previous_release="$(
              git log \
                "$release_parent" \
                --format=%H \
                --grep='^chore: release ' \
                -n 1
            )"

            if [[ -n "$previous_release" ]]; then
              revision_range="${previous_release}..${release_parent}"
            else
              revision_range="$release_parent"
            fi
          fi

          {
            echo "## Changes"
            echo

            if [[ "$(git rev-list --count "$revision_range")" -eq 0 ]]; then
              echo "- No commits since the previous release."
            else
              git log \
                "$revision_range" \
                --format="- %s - %an ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))"
            fi

            printf '\nBuilt from commit `%s`.\n' "$RELEASE_SHA"
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.channel == 'release' }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
