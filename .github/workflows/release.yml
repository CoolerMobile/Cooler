name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - nightly
      bump:
        description: Version bump (auto, patch, minor, major, or x.y.z)
        required: true
        default: auto
        type: string
concurrency:
  group: cooler-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    if: github.actor == 'danfq' && github.triggering_actor == 'danfq'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      tag: ${{ steps.metadata.outputs.tag }}
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve release metadata and bump version
        id: metadata
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          channel="$DISPATCH_CHANNEL"
          version="$(bun scripts/release.ts --bump-only "${REQUESTED_BUMP:-auto}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if [[ "$channel" == "nightly" ]]; then
            git commit -m "chore: release nightly v${version}"
            tag="nightly-v${version}"
            name="Cooler nightly v${version}"
            prerelease="true"
          else
            git commit -m "chore: release v${version}"
            tag="v${version}"
            name="Cooler v${version}"
            prerelease="false"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "channel=$channel"
            echo "tag=$tag"
            echo "name=$name"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Queue EAS ${{ matrix.platform }} build (${{ needs.prepare.outputs.channel }})
    if: github.actor == 'danfq' && github.triggering_actor == 'danfq'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            extension: ipa
          - platform: android
            extension: apk
    runs-on: ubuntu-latest
    steps:
      - name: Check out prepared source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Queue EAS cloud build and download artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          for attempt in 1 2; do
            echo "Queueing EAS ${PLATFORM} build (attempt ${attempt}/2)."
            if bunx eas-cli@latest build \
              --platform "$PLATFORM" \
              --profile "$PROFILE" \
              --non-interactive \
              --wait \
              --json > build.json; then
              break
            fi

            if [[ "$attempt" == 2 ]]; then
              echo "EAS ${PLATFORM} build failed twice; stopping without further retries." >&2
              exit 1
            fi
            echo "EAS ${PLATFORM} build failed; retrying once." >&2
          done

          artifact_url="$(jq -er 'if type == "array" then .[0] else . end | .artifacts.applicationArchiveUrl' build.json)"
          output="artifacts/Cooler-${PROFILE}-${VERSION}-${PLATFORM}.${EXTENSION}"
          curl --fail --location --retry 3 --output "$output" "$artifact_url"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cooler-${{ needs.prepare.outputs.channel }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.actor == 'danfq' && github.triggering_actor == 'danfq'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS and Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cooler-${{ needs.prepare.outputs.channel }}-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.channel == 'release' }}
          generate_release_notes: true
          body: |
            Built from commit ${{ needs.prepare.outputs.sha }}.

            This ${{ needs.prepare.outputs.channel }} release includes iOS and Android artifacts built by EAS. GitHub generated the changelog below from the commits since the previous release, including commit authors and new contributors.
          files: artifacts/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
